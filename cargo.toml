[package]
name = "hidapi"
version = "1.0.0"
edition = "2024"
authors = ["me"]

[dependencies]
# Base
tokio = { version = "1.52.1", features = ["full"] }
anyhow = "1.0"
once_cell = "1.19"

# Razer service
librazer = { path = "./librazer" }
hidapi = "2.6"

# Keyboard hooks
rdev = { version = "0.5", features = ["unstable_grab"] }

# windows power state / utility actions
brightness = "0.8"
futures = "0.3"
pollster = "0.4.0"
windows = { version = "0.58.0", features = [
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_RemoteDesktop"
] }

# AC / Battery state
windows-sys = { version = "0.52", features = [
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation"
] }

# Windows tray
tray-icon = "0.14"
winit = "0.29"

# SVG rendering
resvg = "0.42"
usvg = "0.42"

# Persisting config to disk
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
