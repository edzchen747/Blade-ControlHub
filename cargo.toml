[package]
authors = ["me"]
edition = "2024"
name = "blade-controlhub"
version = "1.0.0"

[dependencies]
anyhow = "1.0"
thiserror = "1"

# windows power state / utility actions
brightness = "0.8"
futures = "0.3"
hidapi = "2.6"
winreg = "0.52"

# Razer service
librazer = { path = "./librazer" }
once_cell = "1.19"
pollster = "0.4.0"

# Keyboard hooks
rdev = { version = "0.5", features = ["unstable_grab"] }

# SVG rendering
resvg = "0.42"
usvg = "0.42"

# Persisting config to disk
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Base
tokio = { version = "1.52.1", features = ["full"] }

# Windows tray
sysinfo = "0.30"
tray-icon = "0.14"
windows = { version = "0.58.0", features = [
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_Graphics_Gdi",
    "Win32_System_Console"
] }

# AC / Battery state
windows-sys = { version = "0.52", features = [
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader"
] }
winit = "0.29"

# App and OSD
eframe = "0.27"
strum_macros = "0.28.0"
egui_extras = { version = "0.27", features = ["svg"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
winres = "0.1"
