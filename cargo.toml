[package]
authors = ["me"]
edition = "2024"
name = "blade-controlhub"
version = "1.0.0"
default-run = "blade-controlhub"

[features]
# Tauri serves the UI from `devUrl` unless `custom-protocol` is on; the Tauri
# CLI normally passes it, but this project builds with plain cargo, so it is a
# default here. `cargo run --no-default-features` switches back to the Vite dev
# server for UI work.
default = ["embedded-ui"]
embedded-ui = ["tauri/custom-protocol"]

[dependencies]
anyhow = "1.0"
thiserror = "1"

brightness = "0.8"
futures = "0.3"
hidapi = "2.6"
winreg = "0.52"

librazer = { path = "./librazer" }
once_cell = "1.19"
pollster = "0.4.0"

rdev = { version = "0.5", features = ["unstable_grab"] }

resvg = "0.42"
usvg = "0.42"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sysinfo = "0.30"
windows-core = "0.58.0"
windows = { version = "0.58.0", features = [
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Dwm",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture"
    ,"Win32_Security"
    ,"Win32_UI_Shell_PropertiesSystem"
    ,"implement"
    ,"Win32_Devices_FunctionDiscovery"
    ,"Win32_System_Com_StructuredStorage"
] }

windows-sys = { version = "0.52", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Security"
] }
strum_macros = "0.28.0"

tauri = { version = "2.11", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
