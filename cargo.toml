[package]
name = "hidapi"
version = "1.0.0"
edition = "2024"
authors = ["me"]

[dependencies]
hidapi = "2.6"
rdev = { version = "0.5", features = ["unstable_grab"] }
once_cell = "1.19"
brightness = "0.8"
futures = "0.3"
tokio = { version = "1.52.1", features = ["full"] }
windows = { version = "0.58.0", features = [
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi"
] }
anyhow = "1.0"
librazer = { path = "./librazer" }
pollster = "0.4.0"