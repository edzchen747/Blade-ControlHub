[package]
authors = ["me"]
edition = "2024"
name = "blade-controlhub"
version = "1.0.0"
default-run = "blade-controlhub"

# [lib]
# name = "blade_controlhub"
# path = "src/lib.rs"

# [[bin]]
# name = "blade-controlhub"
# path = "src/main.rs"

[[bin]]
name = "blade-settings"
path = "src/settings_window.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1"

# windows power state / utility actions
brightness = "0.8"
futures = "0.3"
hidapi = "2.6"
winreg = "0.52"

# Razer service
librazer = { path = "./librazer" }
once_cell = "1.19"
pollster = "0.4.0"

# Keyboard hooks
rdev = { version = "0.5", features = ["unstable_grab"] }

# SVG rendering
resvg = "0.42"
usvg = "0.42"

# Persisting config to disk
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Base
tokio = { version = "1.52.1", features = ["full"] }

# Windows tray
sysinfo = "0.30"
tray-icon = "0.14"
windows = { version = "0.58.0", features = [
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_System_Threading"
] }

# AC / Battery state
windows-sys = { version = "0.52", features = [
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security"
] }
winit = "0.29"

# App and OSD
eframe = "0.27"
strum_macros = "0.28.0"
egui_extras = { version = "0.27", features = ["svg"] }
raw-window-handle = "0.6"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
winres = "0.1"
