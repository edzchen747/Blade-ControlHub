<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c73e3"/>
      <stop offset="100%" stop-color="#6c63d3"/>
    </linearGradient>
    <linearGradient id="event" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e69f66"/>
      <stop offset="100%" stop-color="#d48f56"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ccca1"/>
      <stop offset="100%" stop-color="#5cb890"/>
    </linearGradient>
    <linearGradient id="lib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#cc6a4f"/>
    </linearGradient>
    <linearGradient id="hw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3da877"/>
      <stop offset="100%" stop-color="#2d8867"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a0a0b0"/>
    </marker>
  </defs>
  <rect width="900" height="620" rx="12" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" fill="#cdd6f4" font-size="20" font-weight="700">Blade ControlHub — Architecture Overview</text>
  <rect x="60" y="58" width="780" height="100" rx="10" fill="#2a2a3d" stroke="#7c73e3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="82" text-anchor="middle" fill="#7c73e3" font-size="12" font-weight="600" letter-spacing="1">UI LAYER</text>
  <rect x="110" y="94" width="190" height="50" rx="8" fill="url(#ui)" filter="url(#shadow)"/>
  <text x="205" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Settings Window</text>
  <text x="205" y="132" text-anchor="middle" fill="#ddd" font-size="10">egui / eframe</text>
  <rect x="355" y="94" width="190" height="50" rx="8" fill="url(#ui)" filter="url(#shadow)"/>
  <text x="450" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">System Tray Icon</text>
  <text x="450" y="132" text-anchor="middle" fill="#ddd" font-size="10">tray-icon crate</text>
  <rect x="600" y="94" width="190" height="50" rx="8" fill="url(#ui)" filter="url(#shadow)"/>
  <text x="695" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">OSD Overlay</text>
  <text x="695" y="132" text-anchor="middle" fill="#ddd" font-size="10">Transparent always-on-top</text>
  <line x1="450" y1="158" x2="450" y2="195" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="182" fill="#a0a0b0" font-size="10">mpsc channel</text>
  <rect x="270" y="195" width="360" height="56" rx="10" fill="url(#event)" filter="url(#shadow)"/>
  <text x="450" y="219" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Event Dispatcher</text>
  <text x="450" y="237" text-anchor="middle" fill="#eee" font-size="11">Routes events to device controls and OSD</text>
  <line x1="340" y1="251" x2="200" y2="290" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="251" x2="450" y2="290" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="251" x2="700" y2="290" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="290" width="780" height="120" rx="10" fill="#2a2a3d" stroke="#6ccca1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="314" text-anchor="middle" fill="#6ccca1" font-size="12" font-weight="600" letter-spacing="1">CORE LAYER</text>
  <rect x="90" y="326" width="220" height="72" rx="8" fill="url(#mid)" filter="url(#shadow)"/>
  <text x="200" y="350" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Device Controls</text>
  <text x="200" y="368" text-anchor="middle" fill="#eee" font-size="10">Perf Mode . RGB . Battery . Brightness</text>
  <text x="200" y="384" text-anchor="middle" fill="#eee" font-size="10">Refresh Rate . Backlight . GPU Mode</text>
  <rect x="340" y="326" width="220" height="72" rx="8" fill="url(#mid)" filter="url(#shadow)"/>
  <text x="450" y="350" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Windows Services</text>
  <text x="450" y="368" text-anchor="middle" fill="#eee" font-size="10">Power Monitor . Standby Monitor</text>
  <text x="450" y="384" text-anchor="middle" fill="#eee" font-size="10">Keyboard Hooks . External Events</text>
  <rect x="590" y="326" width="220" height="72" rx="8" fill="url(#mid)" filter="url(#shadow)"/>
  <text x="700" y="350" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Config Persistence</text>
  <text x="700" y="368" text-anchor="middle" fill="#eee" font-size="10">Dual Power Profiles (AC / Battery)</text>
  <text x="700" y="384" text-anchor="middle" fill="#eee" font-size="10">JSON via serde . Key Mappings</text>
  <line x1="200" y1="398" x2="330" y2="445" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="398" x2="570" y2="445" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="430" fill="#a0a0b0" font-size="10">HID reports</text>
  <text x="540" y="430" fill="#a0a0b0" font-size="10">device state</text>
  <rect x="250" y="445" width="400" height="72" rx="10" fill="url(#lib)" filter="url(#shadow)"/>
  <text x="450" y="472" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">librazer</text>
  <text x="450" y="494" text-anchor="middle" fill="#eee" font-size="11">Device Detection . Command Encoding . HID I/O (hidapi)</text>
  <line x1="450" y1="517" x2="450" y2="548" stroke="#a0a0b0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="540" fill="#a0a0b0" font-size="10">HID (VID 0x1570)</text>
  <rect x="300" y="548" width="300" height="52" rx="10" fill="url(#hw)" filter="url(#shadow)"/>
  <text x="450" y="572" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Razer Blade Hardware</text>
  <text x="450" y="590" text-anchor="middle" fill="#eee" font-size="11">Embedded Controller via HID Interface</text>
</svg>